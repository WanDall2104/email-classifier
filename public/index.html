<!DOCTYPE html>
<html lang="pt-BR">
<head>
    <meta charset="UTF-8">
    <title>Email Classifier</title>
    <link rel="stylesheet" href="css/styles.css">
</head>
<body>
    
    <div class="container">
        <h1>Email Classifier</h1>
        <label>Escolha um arquivo (.txt ou .pdf):</label>
        <input type="file" id="fileInput">
        <label>Ou cole o texto do email:</label>
        <textarea id="textInput" rows="6" placeholder="Cole aqui o conteúdo do email..."></textarea>
        <button id="submitBtn">Processar Email</button>
        <div class="result" id="resultDiv" style="display:none; margin-top:16px;">
            <h3>Resultado</h3>
            <p><strong>Categoria:</strong> <span id="categorySpan"></span></p>
            <p><strong>Confiança:</strong> <span id="confidenceSpan"></span></p>
            <p><strong>Resposta sugerida:</strong></p>
            <pre id="suggestedReply"></pre>
            <button id="copyReplyBtn" style="margin-top:8px;">Copiar Resposta</button>
            <details style="margin-top:8px;"><summary>Mostrar JSON completo</summary>
                <pre id="resultText"></pre>
            </details>
        </div>

        <div class="error" id="errorDiv" style="display:none; margin-top:16px; color:#b00020;">
            <pre id="errorText"></pre>
        </div>
    </div>
    <script src="js/main.js"></script>
</body>
</html>
