<!doctype html>
<html lang="pt-BR">
<head>
    <meta charset="utf-8" />
    <meta name="viewport" content="width=device-width,initial-scale=1" />
    <title>Email Classifier — Demo</title>
    <link rel="stylesheet" href="css/styles.css">
</head>

<body>

<header><h1>Email Classifier</h1></header>
<main class="card">
    <p>Faça upload de um arquivo (.txt ou .pdf) ou cole o texto do email abaixo e clique em <strong>Processar</strong>.</p>
    <div>
        <label for="file">Arquivo (.txt / .pdf)</label><br/>
        <input id="file" type="file" accept=".txt,.pdf" />
    </div>

    <div style="margin-top:12px">
        <label for="text">Ou cole o texto do email</label>
        <textarea id="text" placeholder="Cole aqui..."></textarea>
    </div>

    <div style="margin-top:12px" class="actions">
        <button id="send">Processar</button>
        <span class="spinner" aria-hidden="true" title="Processando" hidden></span>
    </div>

    <div class="result" id="result" aria-live="polite"></div>
</main>

<script src="js/main.js"></script>
</body>
</html>
