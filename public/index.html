<!DOCTYPE html>
<html lang="pt-BR">
<head>
    <meta charset="UTF-8">
    <title>Email Classifier</title>
    <link rel="stylesheet" href="css/styles.css">
</head>
<body>
    <div class="container">
        <h1>Email Classifier</h1>
        <label>Escolha um arquivo (.txt ou .pdf):</label>
        <input type="file" id="fileInput">
        <label>Ou cole o texto do email:</label>
        <textarea id="textInput" rows="6" placeholder="Cole aqui o conteúdo do email..."></textarea>
        <button id="submitBtn">Processar Email</button>

        <div class="result" id="resultDiv">
            <h3>Resultado:</h3>
            <pre id="resultText"></pre>
        </div>

        <div class="error" id="errorDiv">
            <pre id="errorText"></pre>
        </div>
    </div>

<script src="js/main.js"></script>
</body>
</html>
